      <div class="wrap">

        <div class="game-head">
          <div class="cover" id="game-cover"></div>
          <div class="game-info">
            <p class="eyebrow" id="game-status"></p>
            <h1 id="game-name"></h1>
            <div class="badges" id="game-badges"></div>
            <ul class="facts" id="facts"></ul>
            <div class="actions">
              <button class="btn primary" type="button" id="play-first">▶ Watch from Part 1</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="wrap">
      <section class="player" id="player" hidden>
        <div class="frame">
          <iframe title="VOD player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
        </div>
        <div class="now">
          <h2 id="now-title"></h2>
          <button class="btn primary" type="button" id="next">Next part →</button>
          <a class="btn" id="on-youtube" href="#" target="_blank" rel="noopener">Open on YouTube</a>

      <div class="section-head"><h2>VODs</h2><span>oldest first</span></div>
      <ol class="vods" id="vods"></ol>
    </div>

  <footer class="footer">
    <div class="wrap">
